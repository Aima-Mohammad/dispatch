[project]
name = "dispatch"
version = "0.1.0"
description = "Case dispatch engine for service-level-driven workload allocation"
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/dispatch/py.typed" = "dispatch/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.6", "mypy>=1.11"]
app = ["streamlit>=1.39", "plotly>=5.24"]